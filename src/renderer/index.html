<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitator - Sprint Planning Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Sprint Planning Calculator</h1>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sprint Details Section -->
            <section class="section">
                <h2>Sprint Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="teamVelocity" class="form-label" title="Team's average velocity in story points from previous sprints">
                            Team Velocity:
                        </label>
                        <input type="number" id="teamVelocity" class="form-input" value="88" placeholder="Enter team velocity">
                    </div>

                    <div class="form-group">
                        <label for="sprintStarts" class="form-label" title="Start date of the sprint">
                            Sprint Starts:
                        </label>
                        <input type="date" id="sprintStarts" class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="sprintEnds" class="form-label" title="End date of the sprint">
                            Sprint Ends:
                        </label>
                        <input type="date" id="sprintEnds" class="form-input">
                    </div>

                    <div class="form-group">
                        <label for="sprintDays" class="form-label" title="Number of sprint days excluding weekends">
                            Total Days:
                        </label>
                        <span id="sprintDays" class="form-display">0</span>
                    </div>

                    <div class="form-group">
                        <label for="reservedCapacity" class="form-label" title="Percentage of time reserved for non-sprint activities">
                            Reserved Capacity (%):
                        </label>
                        <input type="number" id="reservedCapacity" class="form-input" value="10">
                    </div>
                </div>
            </section>

            <!-- Team Details Section -->
            <section class="section">
                <h2>Team Details</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="teamSize" class="form-label" title="Total number of team members">
                            Team Size:
                        </label>
                        <span id="teamSize" class="form-display">0</span>
                    </div>

                    <div class="form-group">
                        <label for="totalTeamDays" class="form-label" title="Total available team days during the sprint">
                            Total Team Days:
                        </label>
                        <span id="totalTeamDays" class="form-display">0</span>
                    </div>

                    <div class="form-group">
                        <label for="totalTeamCapacity" class="form-label" title="Team capacity based on available days">
                            Sprint Capacity (%):
                        </label>
                        <span id="totalTeamCapacity" class="form-display">0</span>
                    </div>

                    <div class="form-group">
                        <label for="targetStoryPoints" class="form-label" title="Sprint target story points based on reserved capacity">
                            Sprint Target:
                        </label>
                        <span id="targetStoryPoints" class="form-display">0</span>
                    </div>
                </div>
            </section>

            <!-- Team Members Section -->
            <section class="section">
                <div class="section-header">
                    <h2>Team Members</h2>
                    <div class="button-group">
                        <button id="addMemberBtn" class="btn btn-primary">+ Add Member</button>
                        <button id="saveTemplateBtn" class="btn btn-secondary">💾 Save Template</button>
                        <button id="loadTemplateBtn" class="btn btn-secondary">📁 Load Template</button>
                    </div>
                </div>

                <div class="table-container">
                    <table id="teamTable" class="team-table">
                        <thead>
                            <tr>
                                <th>Team Member</th>
                                <th>Available Days</th>
                                <th>PTO Dates</th>
                                <th>Story Point Capacity</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teamTableBody">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by <a href="https://github.com/omaciel/capacitator" target="_blank">Capacitator</a></p>
        </footer>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading-indicator hidden">
            <div class="spinner"></div>
            <span>Processing...</span>
        </div>

        <!-- Modal for notifications -->
        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">Information</h3>
                    <button id="modalClose" class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <p id="modalMessage"></p>
                </div>
                <div class="modal-footer">
                    <button id="modalOk" class="btn btn-primary">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer-browser.js"></script>
</body>
</html>
